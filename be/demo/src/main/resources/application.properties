spring.application.name=demo
game.room.default-round-count=7
game.room.default-coin-price=50
game.room.default-turn-duration-seconds=180
game.room.disconnect-grace-seconds=30
# 게임 시작 최소 인원. 혼자 테스트할 때는 실행 인자로 1을 준다.
game.room.min-players=4
# 게임 화면 배경 이미지 개수. 프론트 assets/game/ 이미지 수와 맞춘다.
game.room.background-count=17
# 라운드 준비 단계 시간(초): 역할 공개 → "라운드를 준비해주세요" 안내
game.round.role-reveal-seconds=2
game.round.start-announce-seconds=1
# 라운드마다 살인마가 등장할 확률 (0~1)
game.role.murderer-chance=0.3
# 라운드당 최대 턴 수
game.round.max-turns=7
# 첫 라운드 시작 골드
game.economy.start-gold=10
# 최종 투표(중앙에 선 뒤) 시간, 투표 결과 안내 시간(초)
game.vote.final-seconds=30
game.vote.result-seconds=5
# 밤 단계 시간(초). 살인마가 살해 대상을 고르는 최대 시간. 살아 있는 살인마가 없으면(또는 장마면) 밤은 건너뛰고,
# 살인마가 대상을 고르면 그 즉시 밤이 끝난다.
game.round.night-seconds=30
# 도적 강탈: 인원이 large-room-players 이상이면 targets-large명, 아니면 targets-small명에게서 amount G씩
game.thief.large-room-players=6
game.thief.targets-large=2
game.thief.targets-small=1
game.thief.amount=1
# 살인마 밤 행동 비용(G)
game.murderer.kill-cost=1
# 턴 정산 때 생존자가 받는 골드, 라운드 종료 때 전원이 받는 골드
game.economy.turn-gold=2
game.economy.round-end-gold=5
# 라운드 종료 결과 확인 시간(초)
game.round.end-seconds=30
# 인물 카드 뽑기에서 한 단계 위 등급이 나올 확률 (일반→희귀, 희귀→전설)
game.card.upgrade-chance=0.1
