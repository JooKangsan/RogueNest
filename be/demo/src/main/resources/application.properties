spring.application.name=demo
game.room.default-round-count=7
game.room.default-coin-price=50
game.room.default-turn-duration-seconds=120
game.room.disconnect-grace-seconds=30
# 게임 시작 최소 인원. 혼자 테스트할 때는 실행 인자로 1을 준다.
game.room.min-players=1
# 게임 화면 배경 이미지 개수. 프론트 assets/game/ 이미지 수와 맞춘다.
game.room.background-count=17
# 라운드 준비 단계 시간(초): 역할 공개 → 라운드 시작 안내
game.round.role-reveal-seconds=5
game.round.start-announce-seconds=3
# 라운드마다 살인마가 등장할 확률 (0~1)
game.role.murderer-chance=0.3
# 라운드당 최대 턴 수
game.round.max-turns=7
# 첫 라운드 시작 골드
game.economy.start-gold=5
